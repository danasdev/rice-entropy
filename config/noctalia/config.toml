# Noctalia — rice "ondas roxas" (overrides; o resto usa os padrões)
# Referência completa: https://github.com/noctalia-dev/noctalia/blob/main/example.toml

[shell]
font_family = "Inter"
corner_radius_scale = 1.15
lang = "pt-BR"
polkit_agent = false
avatar_path = "~/.face"

[shell.greeter_sync]
auto_sync = false  # a tela de login tem visual fixo (greeter.toml)

[shell.panel]
transparency_mode = "glass"
borders = true
shadow = true
launcher_placement = "floating"
launcher_position = "center"

[shell.window_switcher]
style = "carousel"
mru = true

[wallpaper]
enabled = true
fill_mode = "crop"
directory = "~/Pictures/Wallpapers"
transition = ["fade", "disc", "zoom"]
transition_duration = 1200

[wallpaper.default]
path = "~/Pictures/Wallpapers/entropy-default.png"

[theme]
mode = "dark"
source = "builtin"
builtin = "Tokyo-Night"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["hyprland", "kitty", "gtk3", "gtk4", "qt", "kcolorscheme", "btop", "cava"]
community_ids = ["pywalfox"]

[theme.templates.user.atalhos]
input_path = "~/.config/noctalia/templates/atalhos.css"
output_path = "~/.local/share/atalhos/cores.css"

[theme.templates.user.gtksourceview]
input_path = "~/.config/noctalia/templates/gtksourceview.xml"
output_path = "~/.local/share/gtksourceview-5/styles/noctalia.xml"

[lockscreen]
enabled = true
fingerprint = false   # desbloquear com a digital
blur_intensity = 0.35
tint_intensity = 0.25
transition = ["fade"]
transition_duration = 900

[bar.main]
position = "top"
thickness = 34
background_opacity = 0.18
compositor_blur = true
radius = 14
margin_ends = 10
margin_edge = 8
padding = 14
widget_spacing = 10
shadow = true
font_scale = 0.95
start = ["launcher", "workspaces", "media"]
center = ["clock"]
end = ["tray", "network", "volume", "battery", "notifications", "control-center"]

[dock]
enabled = false
position = "bottom"
icon_size = 34
background_opacity = 0.55
radius = 14
radius_top_left = 14
radius_top_right = 14
radius_bottom_left = 14
radius_bottom_right = 14
margin_edge = 8
item_spacing = 6
main_axis_padding = 10
cross_axis_padding = 6
shadow = true
show_running = true
reserve_space = false
auto_hide = true
smart_auto_hide = true
magnification = true
magnification_scale = 1.35
show_dots = true
launcher_position = "none"
launcher_icon = "grid-dots"
pinned = ["entropy-apps", "kitty", "org.gnome.Nautilus", "firefox", "spotify-launcher"]

# ── Widgets da barra ─────────────────────────────────────────────
[widget.workspaces]
style = "regular"
show_labels = true
show_icons = false
labels_only_when_occupied = false
active_pill_size = 2.0
pill_scale = 1.0

[widget.media]
hide_when_no_media = true
hide_artist = true
max_length = 200
title_scroll = "on_hover"

[widget.media.actions]
left = "exec @HOME@/.config/hypr/rice/scripts/focar-player.sh"

[widget.clock]
format = "{:%a %d  %H:%M}"
tooltip_format = "{:%A, %d de %B de %Y}"

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.battery]
display_mode = "glyph"
show_label = true
hide_when_full = true

# ── Clima (localização aproximada pelo IP) ───────────────────────
[weather]
enabled = true
unit = "celsius"
effects = true

[location]
auto_locate = true

# ── Widgets da área de trabalho ──────────────────────────────────
[desktop_widgets]
enabled = true
schema_version = 2
widget_order = ["hd_clock", "hd_date", "hd_weather", "hd_viz", "hd_media", "hd_cpu", "hd_ram", "hd_calendar", "lp_clock", "lp_date", "lp_weather", "lp_viz", "lp_media", "lp_cpu", "lp_ram", "lp_calendar"]

[desktop_widgets.widget.hd_clock]
type = "clock"
output = "HDMI-A-1"
cx = 2250.0
cy = 150.0
box_width = 340.0
box_height = 120.0
[desktop_widgets.widget.hd_clock.settings]
clock_style = "digital"
format = "{:%H:%M}"
center_text = true
color = "surface"
shadow = false
background = false

[desktop_widgets.widget.hd_date]
type = "clock"
output = "HDMI-A-1"
cx = 2250.0
cy = 235.0
box_width = 340.0
box_height = 30.0
[desktop_widgets.widget.hd_date.settings]
clock_style = "digital"
format = "{:%A, %d de %B}"
center_text = true
color = "surface_variant"
shadow = false
background = false

[desktop_widgets.widget.hd_weather]
type = "weather"
output = "HDMI-A-1"
cx = 300.0
cy = 230.0
box_width = 380.0
box_height = 200.0
[desktop_widgets.widget.hd_weather.settings]
