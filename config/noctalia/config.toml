# ── Central de controle ──────────────────────────────────────────
[control_center]
width = 820
sidebar = "compact"
show_shortcut_labels = true
show_session_button = true

[[control_center.shortcuts]]
type = "network"
[[control_center.shortcuts]]
type = "bluetooth"
[[control_center.shortcuts]]
type = "notifications"
[[control_center.shortcuts]]
type = "nightlight"
[[control_center.shortcuts]]
type = "caffeine"
[[control_center.shortcuts]]
type = "power_profile"

# ── Hooks ────────────────────────────────────────────────────────
[hooks]
# contraste automático dos widgets de texto conforme o wallpaper
wallpaper_changed = "@HOME@/.config/hypr/rice/scripts/contraste-widgets.py; @HOME@/.config/hypr/rice/scripts/vidro-adaptativo.py; @HOME@/.config/hypr/rice/scripts/icones.sh; @HOME@/.config/hypr/rice/scripts/reiniciar-painel.sh"
started = "sleep 3; @HOME@/.config/hypr/rice/scripts/contraste-widgets.py; @HOME@/.config/hypr/rice/scripts/vidro-adaptativo.py; noctalia msg bar-hide; @HOME@/.config/hypr/rice/scripts/icones.sh"

[calendar]
enabled = true
refresh_minutes = 2
