# hypridle só como "ponte": faz `loginctl lock-session` (e a suspensão) acionar
# a tela de bloqueio do Noctalia. Os tempos de inatividade ficam no Noctalia.
general {
    lock_cmd = pgrep -x noctalia >/dev/null && noctalia msg session lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}
