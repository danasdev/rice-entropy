# ─────────────────────────────────────────────
#  Rice: Noctalia + HyprWindowShade (ondas roxas)
#  Config antiga: hyprland.conf.antes-do-rice
#  Backup completo: ~/.config/hypr-backup-2026-10-05
# ─────────────────────────────────────────────
source = ~/.config/hypr/rice/env.conf
source = ~/.config/hypr/rice/monitors.conf
source = ~/.config/hypr/rice/input.conf
source = ~/.config/hypr/rice/look.conf
source = ~/.config/hypr/rice/animations.conf
source = ~/.config/hypr/rice/rules.conf
source = ~/.config/hypr/rice/binds.conf
source = ~/.config/hypr/rice/autostart.conf

# Shaders por janela (plugin HyprWindowShade)
# Plugin HyprWindowShade (animação de janelas e papel de parede animado): opcional.
# Instale o plugin e descomente a linha abaixo (veja o README).
# source = ~/.config/hypr/windowshade.conf
source = ~/.config/hypr/rice/glass.conf
source = ~/.config/hypr/rice/glass-adaptive.conf

# Cores geradas pelo Noctalia (o próprio Noctalia acrescenta o source abaixo)

# For Noctalia Color templates
source = ~/.config/hypr/noctalia.conf

# borda mais discreta (sobrescreve a cor gerada pelo Noctalia)
general {
    col.active_border = rgba(ffb3ad55)
    col.inactive_border = rgba(1b120600)
}
