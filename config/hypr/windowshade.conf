# HyprWindowShade — plugin de shaders por janela
# Para desativar: comente a linha "source = ~/.config/hypr/windowshade.conf" no hyprland.conf
# (carregado por rice/scripts/plugins.sh, depois do hyprpm)

# Efeito de vidro nos terminais e gerenciadores de arquivos
# (kitty agora usa o hyprglass)
windowrule = match:class (org.kde.dolphin|org.gnome.Nautilus), tag +shader:@HOME@/.config/hypr/shaders/glass.glsl

# Animação de abrir/fechar em todas as janelas
windowrule = match:class .*, tag +shader_open:@HOME@/.config/hypr/shaders/open_fade.glsl
windowrule = match:class .*, tag +shader_close:@HOME@/.config/hypr/shaders/close_fade.glsl

# SUPER+SHIFT+R recarrega os shaders; SUPER+SHIFT+G liga/desliga o vidro na janela focada
bind = SUPER SHIFT, R, exec, hyprctl dispatch reloadshaders
bind = SUPER SHIFT, G, exec, hyprctl dispatch togglewindowshader @HOME@/.config/hypr/shaders/glass.glsl

# Papel de parede animado (ondas fluindo) — SUPER+SHIFT+W liga/desliga
exec-once = sleep 4; hyprctl dispatch layershader noctalia-wallpaper @HOME@/.config/hypr/shaders/wallpaper_waves.glsl
bind = SUPER SHIFT, W, exec, hyprctl dispatch togglelayershader noctalia-wallpaper @HOME@/.config/hypr/shaders/wallpaper_waves.glsl
