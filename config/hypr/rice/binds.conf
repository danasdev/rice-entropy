$mod = SUPER
$term = kitty
$files = nautilus
$browser = firefox
$ipc = noctalia msg

# Apps
bind = $mod, RETURN, exec, $term
bind = $mod, E, exec, $files
bind = $mod, B, exec, $browser

# Noctalia
bind = $mod, SPACE, exec, ~/.config/hypr/rice/painel/entropy-launcher-toggle # menu de apps Entropy
bind = $mod ALT, SPACE, exec, $ipc panel-toggle launcher # menu de apps original do Noctalia
bind = $mod, D, exec, ~/.config/hypr/rice/scripts/show-desktop.sh # mostrar área de trabalho
bind = $mod, S, exec, ~/.config/hypr/rice/painel/entropy-cc-toggle # painel de controle Entropy
bind = $mod ALT, S, exec, $ipc panel-toggle control-center # painel original do Noctalia
bind = $mod, COMMA, exec, $ipc settings-toggle
bind = $mod, L, exec, $ipc session lock
bind = $mod, N, exec, $ipc wallpaper-random
bind = $mod SHIFT, T, exec, $ipc theme-mode-toggle
bind = ALT, TAB, exec, $ipc window-switcher hold
bind = $mod, ESCAPE, exec, $ipc panel-toggle session

# Janelas
bind = $mod, Q, killactive
bind = $mod, M, exec, ~/.config/hypr/rice/scripts/minimizar.py min # minimizar
bind = $mod SHIFT, M, exec, ~/.config/hypr/rice/scripts/minimizar.py restore # restaurar a última minimizada
bind = $mod ALT, M, exec, ~/.config/hypr/rice/scripts/minimizar.py all # restaurar todas
bind = $mod CTRL, M, togglespecialworkspace, minimizadas # ver a gaveta de minimizadas
bind = $mod, F, fullscreen, 1
bind = $mod SHIFT, F, fullscreen, 0
bind = $mod, V, exec, ~/.config/hypr/rice/scripts/flutuar.sh # flutuar/sobrepor (70% e centralizada)
bind = $mod, P, pseudo
bind = $mod, J, layoutmsg, togglesplit
bind = $mod CTRL SHIFT, Q, exit # sair do Hyprland (logout)

bind = $mod, left, exec, ~/.config/hypr/rice/scripts/snap.py left
bind = $mod ALT, left, movefocus, l
bind = $mod, right, exec, ~/.config/hypr/rice/scripts/snap.py right
bind = $mod ALT, right, movefocus, r
bind = $mod, up, exec, ~/.config/hypr/rice/scripts/snap.py up
bind = $mod ALT, up, movefocus, u
bind = $mod, down, exec, ~/.config/hypr/rice/scripts/snap.py down
bind = $mod ALT, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
binde = $mod CTRL, left, resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up, resizeactive, 0 -40
binde = $mod CTRL, down, resizeactive, 0 40
bindm = $mod, mouse:272, movewindow
# soltar depois de arrastar: encaixa se o cursor estiver numa borda/canto (estilo KDE)
bindr = $mod, mouse:272, exec, ~/.config/hypr/rice/scripts/snap.py drop
bindm = $mod, mouse:273, resizewindow

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, TAB, workspace, e+1
bind = $mod SHIFT, TAB, workspace, e-1
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Screenshots (área / tela inteira) -> área de transferência e ~/Pictures/Screenshots
bind = , PRINT, exec, ~/.config/hypr/rice/scripts/print.sh area
bind = $mod, PRINT, exec, ~/.config/hypr/rice/scripts/print.sh tela

# Gravação de tela (aperta de novo pra parar) -> ~/Vídeos
bind = SHIFT, PRINT, exec, ~/.config/hypr/rice/scripts/gravar.sh area
bind = $mod SHIFT, PRINT, exec, ~/.config/hypr/rice/scripts/gravar.sh tela

# Áudio, brilho e mídia (com OSD do Noctalia)
bindel = , XF86AudioRaiseVolume, exec, $ipc volume-up
bindel = , XF86AudioLowerVolume, exec, $ipc volume-down
bindl = , XF86AudioMute, exec, $ipc volume-mute
bindl = , XF86AudioMicMute, exec, $ipc mic-mute
bindel = , XF86MonBrightnessUp, exec, $ipc brightness-up
bindel = , XF86MonBrightnessDown, exec, $ipc brightness-down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bind = $mod SHIFT, A, exec, ~/.config/hypr/rice/scripts/toggle-espectro.sh # liga/desliga espectro

# Escolher onde a PRÓXIMA janela abre (dwindle): baixo/cima/esquerda/direita da janela focada
bind = $mod CTRL ALT, down, layoutmsg, preselect d
bind = $mod CTRL ALT, up, layoutmsg, preselect u
bind = $mod CTRL ALT, left, layoutmsg, preselect l
bind = $mod CTRL ALT, right, layoutmsg, preselect r

# Atalhos curtos para a mesma coisa: próxima janela abre embaixo (Z) ou à direita (X)
bind = $mod, Z, layoutmsg, preselect d
bind = $mod, X, layoutmsg, preselect r
