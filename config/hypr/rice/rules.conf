# Transparência estilo "vidro" (o blur faz o efeito fosco)
windowrule = match:class ^(kitty|org.kde.konsole|Alacritty)$, opacity 0.82 0.74
windowrule = match:class ^(org.gnome.Nautilus|org.gnome.*)$, opacity 0.90 0.82

# Janela de configurações do Noctalia flutuando no centro
windowrule = match:class ^(dev.noctalia.Noctalia)$, float on
windowrule = match:class ^(dev.noctalia.Noctalia)$, size 1080 820
windowrule = match:class ^(dev.noctalia.Noctalia)$, center on

# Diálogos flutuantes
windowrule = match:class ^(pavucontrol|nm-connection-editor|blueman-manager|qt6ct|nwg-look)$, float on
windowrule = match:title ^(Abrir arquivo|Salvar arquivo|Open File|Save File)(.*)$, float on

# Blur na barra, dock, painéis e notificações do Noctalia
layerrule = match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$, blur on
layerrule = match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$, ignore_alpha 0.5
layerrule = match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$, blur_popups on
layerrule = match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$, no_anim on

# Apps não podem se maximizar sozinhos (o kitty pedia isso e cobria as outras janelas).
# Maximizar continua no SUPER+F / SUPER+↑.
windowrule = match:class .*, suppress_event maximize

# App de atalhos: janela flutuante centralizada
windowrule = match:class ^(atalhos)$, float on
windowrule = match:class ^(atalhos)$, size (monitor_w*0.72) (monitor_h*0.82)
windowrule = match:class ^(atalhos)$, center on

# Steam: janelas secundárias flutuam no centro (a principal continua no mosaico)
windowrule = match:class ^(steam)$ match:title ^(Steam Settings|Friends List|Steam - News.*|Game Servers|Screenshot Uploader|Steam Guard.*|Sign in to Steam|Properties.*|.* - Properties)$, float on
windowrule = match:class ^(steam)$ match:title ^(Steam Settings|Steam Guard.*|Sign in to Steam|Properties.*|.* - Properties)$, center on
windowrule = match:class ^(steam)$ match:title ^(Steam Settings|Properties.*|.* - Properties)$, size (monitor_w*0.55) (monitor_h*0.7)
windowrule = match:class ^(steam)$ match:title ^(Friends List)$, size 360 620
windowrule = match:class ^(entropy-wall-ui|entropy-wall-ui.py)$, float on
windowrule = match:class ^(entropy-wall-ui|entropy-wall-ui.py)$, size 880 660
windowrule = match:class ^(entropy-wall-ui|entropy-wall-ui.py)$, center on
