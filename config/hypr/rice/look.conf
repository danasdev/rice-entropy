# Visual — gaps, bordas, blur (as cores vêm do Noctalia em ../noctalia.conf)
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 1
    col.active_border = rgba(c4a7ffee) rgba(8b6cffee) 45deg
    col.inactive_border = rgba(2a2440aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 16
    rounding_power = 2.5
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 24
        render_power = 3
        offset = 0 6
        color = rgba(05030daa)
        color_inactive = rgba(05030d66)
    }

    blur {
        enabled = true
        size = 10
        passes = 4
        noise = 0.02
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.35
        vibrancy_darkness = 0.2
        popups = true
        new_optimizations = true
        xray = false
    }

    dim_inactive = true
    dim_strength = 0.08
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    animate_manual_resizes = true
    focus_on_activate = true
}

cursor {
    no_hardware_cursors = false
}

# Apps X11 (XWayland) não ficam borrados em monitores com escala fracionada
xwayland {
    force_zero_scaling = true
}
