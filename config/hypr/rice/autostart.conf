exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = systemctl --user start hyprpolkitagent
exec-once = ~/.config/hypr/rice/scripts/noctalia-run.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprctl setcursor Adwaita 24

# Tema GTK / ícones / fontes (as cores vêm do template GTK do Noctalia)
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Entropy'
exec-once = gsettings set org.gnome.desktop.interface font-name 'Inter 10'
exec-once = gsettings set org.gnome.desktop.interface monospace-font-name 'JetBrainsMono Nerd Font 10'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita'
exec-once = hypridle
exec-once = sleep 6; python3 ~/.config/hypr/rice/painel/entropy-island.py
exec-once = sleep 6; python3 ~/.config/hypr/rice/painel/entropy-dock.py
exec-once = sleep 5; python3 ~/.config/hypr/rice/painel/entropy-cc.py --daemon
exec-once = ~/.config/hypr/rice/scripts/plugins.sh
exec-once = sleep 5; python3 ~/.config/hypr/rice/painel/entropy-launcher.py --daemon
