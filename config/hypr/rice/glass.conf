# hyprglass — vidro líquido só no kitty
plugin:hyprglass:enabled = 1
plugin:hyprglass:default_theme = dark
plugin:hyprglass:default_preset = glass

windowrule = match:class negative:kitty, tag +hyprglass_disabled

plugin:hyprglass:dark:brightness = 1.5
plugin:hyprglass:tint_color = 0xffffff10
plugin:hyprglass:adaptive_dim = 0.0
plugin:hyprglass:contrast = 1.1

# vidro nas camadas do sistema (barra, dock, widgets, painéis, notificações)
plugin:hyprglass:layers:enabled = 1
plugin:hyprglass:layers:preset = glass
plugin:hyprglass:layers:namespaces = noctalia-bar-main, noctalia-dock, noctalia-panel, noctalia-attached-panel, noctalia-notification, noctalia-osd, noctalia-window-switcher, noctalia-desktop-widget-calendar-hd_calendar, noctalia-desktop-widget-media_player-lp_media, noctalia-desktop-widget-sysmon-hd_cpu, noctalia-desktop-widget-sysmon-hd_ram, noctalia-desktop-widget-sysmon-lp_cpu, noctalia-desktop-widget-sysmon-lp_ram, noctalia-desktop-widget-volume-0000000000000001, noctalia-desktop-widget-weather-hd_weather, noctalia-desktop-widget-weather-lp_weather, entropy-cc, entropy-island, entropy-launcher

# painel de controle Entropy (Super+S)
layerrule = match:namespace ^entropy-cc$, blur on
layerrule = match:namespace ^entropy-cc$, ignore_alpha 0.2
layerrule = match:namespace ^entropy-cc$, blur_popups on
layerrule = match:namespace ^entropy-cc$, no_anim on

# ilha (hora + bateria no topo)
layerrule = match:namespace ^entropy-island$, blur on
layerrule = match:namespace ^entropy-island$, ignore_alpha 0.2
layerrule = match:namespace ^entropy-island$, no_anim on

# menu de apps Entropy (Super+Space)
layerrule = match:namespace ^entropy-launcher$, blur on
layerrule = match:namespace ^entropy-launcher$, ignore_alpha 0.2
layerrule = match:namespace ^entropy-launcher$, no_anim on
