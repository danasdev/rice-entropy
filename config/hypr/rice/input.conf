input {
    kb_layout = br
    kb_model = abnt2
    kb_variant = abnt2
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe_touch = false
}
gesture = 3, horizontal, workspace
